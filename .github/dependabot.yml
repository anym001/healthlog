version: 2
updates:
  # GitHub Actions: keep the pinned SHAs in the four workflows fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # PRs always target dev, never main (see CONTRIBUTING.md); main only
    # updates via the dev -> main release PR.
    target-branch: "dev"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python dependencies (FastAPI, SQLAlchemy, Alembic, psycopg, APScheduler …).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      python:
        patterns:
          - "*"

  # Base image bumps (python:3.12-slim, s6-overlay is pinned via ARG).
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      docker:
        patterns:
          - "*"

  # Images in docker-compose.yml. Their tags are the versions the docs point
  # to and CI tests against, so every bump arrives as a tested PR:
  # - grafana/grafana: new majors included.
  # - timescale/timescaledb: Dependabot keeps the tag's suffix, so it stays on
  #   -pg16 and never proposes a Postgres major (that needs a dump/restore).
  #   Existing installs need the new image plus a `healthlog` restart, which
  #   updates the extension; say so in the release notes (CONTRIBUTING.md).
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    allow:
      - dependency-name: "grafana/grafana"
      - dependency-name: "timescale/timescaledb"
