version: 2
updates:
  # GitHub Actions: keep the pinned SHAs in the four workflows fresh.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # PRs always target dev, never main (see CONTRIBUTING.md); main only
    # updates via the dev -> main release PR.
    target-branch: "dev"
    groups:
      github-actions:
        patterns:
          - "*"

  # Python dependencies (FastAPI, SQLAlchemy, Alembic, psycopg, APScheduler …).
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      python:
        patterns:
          - "*"

  # Base image bumps (python:3.12-slim, s6-overlay is pinned via ARG).
  - package-ecosystem: "docker"
    directory: "/backend"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    groups:
      docker:
        patterns:
          - "*"

  # The Grafana image in docker-compose.yml (`grafana` profile). Its tag is the
  # version grafana/README.md points to and CI tests the dashboards against, so
  # every bump, new majors included, arrives as a tested PR. TimescaleDB is left
  # out on purpose: database image updates are a deliberate step (README
  # "Updating the database image").
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "monthly"
    target-branch: "dev"
    allow:
      - dependency-name: "grafana/grafana"
