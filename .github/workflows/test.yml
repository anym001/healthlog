name: tests

# Runs on every PR for fast feedback, and is reusable (workflow_call) so the
# build/publish workflows gate the image on green tests.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  versions:
    # Single source for the versions CI tests against: the TimescaleDB tag in
    # docker-compose.yml and the Python of the app image's FROM line. Dependabot
    # bumps those files; the jobs below follow without an edit here.
    runs-on: ubuntu-latest
    outputs:
      timescaledb: ${{ steps.v.outputs.timescaledb }}
      python: ${{ steps.v.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          tsdb=$(grep -oE 'timescale/timescaledb:[^[:space:]]+' docker-compose.yml | head -1)
          py=$(sed -nE 's/^FROM python:([0-9]+\.[0-9]+).*/\1/p' backend/Dockerfile)
          echo "timescaledb=$tsdb python=$py"
          [ -n "$tsdb" ] && [ -n "$py" ] || { echo "could not read the versions"; exit 1; }
          echo "timescaledb=$tsdb" >> "$GITHUB_OUTPUT"
          echo "python=$py" >> "$GITHUB_OUTPUT"

  lint-backend:
    # Static gate: ruff lint + format check. Fast, no DB.
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
      # Single source of truth for the ruff pin: requirements-dev.txt. A second
      # hardcoded pin here would let CI and local formatting silently disagree.
      - run: pip install "$(grep '^ruff==' backend/requirements-dev.txt)"
      - name: ruff check
        run: ruff check .
        working-directory: backend
      - name: ruff format --check
        run: ruff format --check .
        working-directory: backend

  test:
    # Full pytest suite against a real TimescaleDB, so the hypertable migration
    # path and the local-timezone daily view are exercised exactly as in prod.
    needs: versions
    runs-on: ubuntu-latest
    services:
      timescaledb:
        image: ${{ needs.versions.outputs.timescaledb }}
        env:
          POSTGRES_USER: healthlog
          POSTGRES_PASSWORD: healthlog
          POSTGRES_DB: healthlog
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U healthlog"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: postgresql+psycopg://healthlog:healthlog@127.0.0.1:5432/healthlog
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ needs.versions.outputs.python }}
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: backend

  smoke:
    # Build the image and boot it as an Unraid user would (PUID/PGID 99:100)
    # against a real TimescaleDB that was just upgraded: the volume is created
    # by an older image, then the current one takes it over. Proves: s6 comes
    # up, init-config chowns /config, migrate updates the TimescaleDB extension
    # and runs alembic upgrade head, uvicorn serves, and a full HAE POST
    # round-trips through to storage.
    needs: versions
    runs-on: ubuntu-latest
    env:
      # An older image to upgrade from (the one HealthLog shipped with before
      # 2.31); kept fixed on purpose so the update path stays exercised.
      PREVIOUS_TIMESCALEDB: timescale/timescaledb:2.17.2-pg16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create network + TimescaleDB (old image, then the current one)
        run: |
          docker network create hl
          start_db() {
            docker run -d --name tsdb --network hl -v tsdb-data:/var/lib/postgresql/data \
              -e POSTGRES_USER=healthlog -e POSTGRES_PASSWORD=healthlog -e POSTGRES_DB=healthlog \
              --health-cmd="pg_isready -U healthlog" --health-interval=5s --health-timeout=5s --health-retries=20 \
              "$1"
            for i in $(seq 1 30); do
              [ "$(docker inspect -f '{{.State.Health.Status}}' tsdb)" = "healthy" ] && return 0
              sleep 2
            done
            echo "database did not become healthy"; docker logs tsdb; exit 1
          }
          start_db "$PREVIOUS_TIMESCALEDB"
          docker rm -f tsdb
          start_db "${{ needs.versions.outputs.timescaledb }}"

      - name: Build image
        run: docker build -f backend/Dockerfile -t healthlog:ci .

      - name: Run container (PUID/PGID 99:100)
        run: |
          mkdir -p cfg
          docker run -d --name hl --network hl -p 8000:8000 \
            -e PUID=99 -e PGID=100 \
            -e INGEST_SECRET=ci-secret \
            -e DATABASE_URL=postgresql+psycopg://healthlog:healthlog@tsdb:5432/healthlog \
            -v "$PWD/cfg:/config" \
            healthlog:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then echo " -> healthy"; exit 0; fi
            sleep 2
          done
          echo "health check timed out"; docker logs hl; exit 1

      - name: Assert /config owned by 99:100
        run: |
          owner=$(stat -c '%u:%g' cfg/logs)
          echo "config owner: $owner"
          [ "$owner" = "99:100" ] || { echo "expected 99:100"; docker logs hl; exit 1; }

      - name: End-to-end ingest POST
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -H "X-Ingest-Token: ci-secret" -H "Content-Type: application/json" \
            --data @backend/tests/fixtures/hae_sample.json \
            http://127.0.0.1:8000/api/ingest)
          echo "HTTP $code"; cat /tmp/resp.json
          [ "$code" = "200" ] || { docker logs hl; exit 1; }
          grep -q '"status":"stored"' /tmp/resp.json || { docker logs hl; exit 1; }

      - name: TimescaleDB extension was updated on start
        run: |
          docker logs hl 2>&1 | grep "TimescaleDB extension updated" || { docker logs hl; exit 1; }
          current=$(docker exec tsdb psql -X -U healthlog -d healthlog -tAc \
            "SELECT e.extversion = a.default_version FROM pg_extension e
             JOIN pg_available_extensions a ON a.name = e.extname WHERE e.extname = 'timescaledb'")
          [ "$current" = "t" ] || { echo "extension not at the image's version"; exit 1; }

      - name: Cleanup
        if: always()
        run: |
          docker rm -f hl tsdb || true
          docker volume rm tsdb-data || true

  grafana:
    # Boot the Grafana pinned in docker-compose.yml (the version the docs point
    # to; Dependabot bumps it) with the repo's provisioning on a network without
    # internet access. Proves: the bundled PostgreSQL datasource works offline,
    # every dashboard JSON provisions, and with the GF_* privacy settings
    # Grafana tries no request to the outside.
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      INGEST_SECRET: ci
      GRAFANA_RO_PASSWORD: ci-ro
      COMPOSE: docker compose -f docker-compose.yml -f .github/ci/grafana-offline.yml --profile grafana
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start TimescaleDB + read-only user
        run: |
          $COMPOSE up -d --wait healthlog-db
          $COMPOSE exec -T healthlog-db psql -U healthlog -d healthlog -c \
            "CREATE USER grafana_ro WITH PASSWORD '$GRAFANA_RO_PASSWORD'; GRANT CONNECT ON DATABASE healthlog TO grafana_ro;"

      - name: Start Grafana (offline)
        run: |
          $COMPOSE up -d grafana
          for i in $(seq 1 60); do
            $COMPOSE exec -T grafana wget -qO- http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          echo "Grafana did not come up"; $COMPOSE logs grafana; exit 1

      - name: Datasource connects
        run: |
          auth="Authorization: Basic $(printf admin:admin | base64)"
          out=$($COMPOSE exec -T grafana wget -qO- --header "$auth" \
            http://127.0.0.1:3000/api/datasources/uid/healthlog-db/health) || true
          echo "$out"
          echo "$out" | grep -q '"status":"OK"' || { $COMPOSE logs grafana; exit 1; }

      - name: Every dashboard is provisioned
        run: |
          auth="Authorization: Basic $(printf admin:admin | base64)"
          want=$(ls grafana/dashboards/*.json | wc -l)
          for i in $(seq 1 15); do
            got=$($COMPOSE exec -T grafana wget -qO- --header "$auth" \
              "http://127.0.0.1:3000/api/search?type=dash-db" | grep -o '"uid":' | wc -l)
            [ "$got" -eq "$want" ] && { echo "$got/$want dashboards"; exit 0; }
            sleep 2
          done
          echo "expected $want dashboards, got $got"; $COMPOSE logs grafana; exit 1

      - name: No outbound requests, no provisioning errors
        run: |
          $COMPOSE logs --no-color grafana > grafana.log
          fail=0
          if grep -iE 'level=(error|warn)' grafana.log \
            | grep -iE 'no such host|dial tcp|i/o timeout|network is unreachable|grafana\.com|gravatar|raintank'; then
            echo "Grafana tried an outbound request (above)"; fail=1
          fi
          if grep -E 'level=error' grafana.log | grep -E 'logger=provisioning\.(dashboard|datasources)'; then
            echo "Grafana logged a provisioning error (above)"; fail=1
          fi
          exit $fail

      - name: Cleanup
        if: always()
        run: $COMPOSE down -v || true
