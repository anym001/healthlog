# HealthLog — TimescaleDB + app container.
#
#   cp .env.example .env   # set POSTGRES_PASSWORD and INGEST_SECRET
#   docker compose up -d
#   docker compose --profile grafana up -d   # optional: Grafana + dashboards
#
# The database is not published on the host: it is reachable only by the app
# over the compose network. Put a TLS reverse proxy in front of port 8000
# before pointing Health Auto Export at it (see README "Reverse proxy").
name: healthlog

services:
  healthlog-db:
    # Pin the exact TimescaleDB tag — never a floating one — so recreating
    # the container can't silently change the engine under your data. This
    # tag is the one CI tests against and the docs point to; Dependabot
    # proposes updates within -pg16. After an update, restart healthlog: it
    # upgrades the extension on start (README "Updating the database image").
    image: timescale/timescaledb:2.31.0-pg16
    container_name: healthlog-db
    environment:
      POSTGRES_USER: healthlog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: healthlog
      # TimescaleDB phones home by default (usage report + version check);
      # read on the first initdb only, migration 0027 covers older volumes.
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthlog"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  healthlog:
    # Pin production to a fixed release (HEALTHLOG_VERSION=X.Y.Z in .env) so
    # a new release never silently updates your instance.
    image: ghcr.io/anym001/healthlog:${HEALTHLOG_VERSION:-latest}
    depends_on:
      healthlog-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://healthlog:${POSTGRES_PASSWORD}@healthlog-db:5432/healthlog
      INGEST_SECRET: ${INGEST_SECRET:?set INGEST_SECRET in .env}
      TZ: ${TZ:-Europe/Vienna}
      ANALYSIS_CRON: ${ANALYSIS_CRON:-30 3 * * *}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      NOTIFY_TOKEN: ${NOTIFY_TOKEN:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
    volumes:
      # Bind mount so config.yaml, the import/ drop folder and narration
      # reports are directly accessible on the host.
      - ${CONFIG_DIR:-./config}:/config
    restart: unless-stopped

  grafana:
    # Optional, started only with `--profile grafana` (see grafana/README.md).
    # This tag is the Grafana version the dashboards are tested against: CI
    # boots it, the docs point here, and Dependabot proposes updates
    # (new majors included) as PRs that CI then tests.
    image: grafana/grafana:13.3.0
    profiles: [grafana]
    container_name: grafana
    depends_on:
      healthlog-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Password of the read-only `grafana_ro` DB user; the provisioned
      # datasource reads it from here (grafana/README.md, prerequisites).
      GRAFANA_RO_PASSWORD: ${GRAFANA_RO_PASSWORD:-}
      # Grafana phones home by default: usage stats, update checks, news feed,
      # Gravatar, external snapshots, plugin installs and signing keys.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_SNAPSHOTS_EXTERNAL_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PUBLIC_KEY_RETRIEVAL_DISABLED: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards/healthlog:ro
    restart: unless-stopped

volumes:
  db-data:
  grafana-data:
